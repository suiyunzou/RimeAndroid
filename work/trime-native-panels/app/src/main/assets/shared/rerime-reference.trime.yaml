preset_keys:
  BackSpace:
    label: ⌫
    repeatable: true
    send: BackSpace
  Return:
    label: enter_labels
    send: Return
  space:
    repeatable: false
    functional: false
    send: space
    label: 空格
  Shift_L:
    label: ⇧
    send: Shift_L
    shift_lock: ascii_long
  IME_switch:
    label: ic@web
    send: LANGUAGE_SWITCH
  VOICE_ASSIST:
    label: ic@microphone-outline
    send: VOICE_ASSIST
  Hide:
    label: 隱藏
    send: BACK
  Keyboard_default:
    label: ABC
    send: Eisu_toggle
    select: .default
  liquid_keyboard_exit:
    label: ABC
    send: FUNCTION
    command: liquid_keyboard
    option: '-1'
  Mode_switch:
    toggle: ascii_mode
    send: SWITCH_CHARSET
    states:
    - 中
    - EN
  Left:
    label: ←
    send: Left
  Right:
    label: →
    send: Right
  Up:
    label: ↑
    send: Up
  Down:
    label: ↓
    send: Down
  Escape:
    label: Esc
    send: Escape
  ReferenceNumbers:
    label: '123'
    send: Eisu_toggle
    select: number
  ReferenceNoOp:
    label: ' '
    send: FUNCTION
    command: smart_input
    option: __noop__
  Reference_settings:
    label: 设置
    send: FUNCTION
    command: smart_input
    option: settings
  Reference_symbols:
    label: '#+='
    send: FUNCTION
    command: smart_input
    option: symbols
  Reference_emoji_variants:
    label: ☻
    send: FUNCTION
    command: smart_input
    option: emoji_variants
  Reference_calculator:
    label: 计算
    send: FUNCTION
    command: smart_input
    option: calculator
  Reference_clipboard:
    label: 剪贴板
    send: FUNCTION
    command: smart_input
    option: clipboard
  Reference_t9:
